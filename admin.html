<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Admin · 이재민 ♥ 강지수</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail" data-bg-color="#f4ede1">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f4ede1"/>
    <text x="600" y="380" text-anchor="middle" font-family="serif" font-size="48" fill="#2a2622">Wedding Admin</text>
    <text x="600" y="440" text-anchor="middle" font-family="monospace" font-size="18" letter-spacing="6" fill="#8a827a">JAEMIN &amp; JISOO</text>
  </svg>
</template>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f4ede1;
  color: #2a2622;
  min-height: 100vh;
  padding: 40px 20px;
}
.wrap { max-width: 1100px; margin: 0 auto; }

/* 로그인 */
.login-box {
  max-width: 400px;
  margin: 80px auto;
  background: #fff;
  padding: 40px 32px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}
.login-box h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  text-align: center;
  margin-bottom: 6px;
}
.login-box .sub {
  text-align: center;
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #8a827a;
  margin-bottom: 32px;
}
.login-box input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d6cfc3;
  font-size: 15px;
  margin-bottom: 12px;
  background: #fafaf7;
}
.login-box button {
  width: 100%;
  padding: 14px;
  background: #2a2622;
  color: #fff;
  border: none;
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  letter-spacing: 0.3em;
  cursor: pointer;
  transition: background 0.2s;
}
.login-box button:hover { background: #8b7355; }
.login-hint {
  text-align: center;
  font-size: 11px;
  color: #8a827a;
  margin-top: 16px;
  line-height: 1.7;
}

/* 대시보드 */
.dashboard { display: none; }
.dashboard.active { display: block; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid #d6cfc3;
}
header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 500;
}
header .actions { display: flex; gap: 8px; }
.btn {
  padding: 10px 16px;
  border: 1px solid #d6cfc3;
  background: #fff;
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  cursor: pointer;
  color: #2a2622;
  transition: all 0.2s;
}
.btn:hover { background: #2a2622; color: #fff; border-color: #2a2622; }
.btn.primary { background: #2a2622; color: #fff; border-color: #2a2622; }
.btn.primary:hover { background: #8b7355; border-color: #8b7355; }

/* 통계 카드 */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: #fff;
  padding: 20px 22px;
  border: 1px solid #ebe4d6;
}
.stat-card .label {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: #8a827a;
  margin-bottom: 8px;
}
.stat-card .value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 500;
  color: #2a2622;
  line-height: 1;
}
.stat-card .value .sub {
  font-size: 14px;
  color: #8a827a;
  margin-left: 4px;
}

/* 탭 */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid #d6cfc3;
  margin-bottom: 20px;
}
.tab {
  padding: 12px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: #8a827a;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { color: #2a2622; border-bottom-color: #2a2622; font-weight: 500; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 테이블 */
.table-wrap {
  background: #fff;
  border: 1px solid #ebe4d6;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid #f0e9db;
}
th {
  background: #faf7f2;
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #5c544c;
  font-weight: normal;
}
tr:hover td { background: #fbf9f4; }
.badge {
  display: inline-block;
  padding: 3px 10px;
  font-size: 11px;
  border-radius: 2px;
  letter-spacing: 0.05em;
}
.badge-groom { background: #dfe8f0; color: #2c4a6b; }
.badge-bride { background: #f0dfe6; color: #6b2c4a; }
.badge-yes { background: #dfe8d5; color: #3d5a2c; }
.badge-no { background: #ebdcdc; color: #7a3a3a; }

.msg-cell { max-width: 400px; line-height: 1.6; }
.date-cell {
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  color: #8a827a;
  white-space: nowrap;
}

.empty {
  padding: 60px 20px;
  text-align: center;
  color: #8a827a;
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  letter-spacing: 0.2em;
}

.loading {
  padding: 40px;
  text-align: center;
  color: #8a827a;
  font-size: 13px;
}
.loading::after {
  content: '...';
  animation: dots 1.2s steps(4, end) infinite;
}
@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

.card-view { display: none; }
@media (max-width: 700px) {
  .table-wrap { display: none; }
  .card-view { display: block; }
  .msg-card {
    background: #fff;
    border: 1px solid #ebe4d6;
    padding: 16px;
    margin-bottom: 10px;
  }
  .msg-card .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .msg-card .name { font-weight: 500; font-size: 15px; }
  .msg-card .meta { font-size: 12px; color: #8a827a; font-family: 'Courier Prime', monospace; }
  .msg-card .body { font-size: 13px; line-height: 1.7; color: #5c544c; margin-top: 6px; }
  header { flex-direction: column; align-items: flex-start; gap: 16px; }
  header h1 { font-size: 22px; }
}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="wrap" id="loginWrap">
  <div class="login-box">
    <h1>Wedding Admin</h1>
    <div class="sub">JAEMIN &amp; JISOO · 2026.10.11</div>
    <input type="password" id="pwd" placeholder="관리자 비밀번호" autocomplete="off">
    <button id="loginBtn">ENTER</button>
    <div class="login-hint">
      신랑신부만 접근할 수 있는 페이지입니다.<br>
      비밀번호를 잊으신 경우 웹 관리자에게 문의하세요.
    </div>
  </div>
</div>

<!-- 대시보드 -->
<div class="wrap dashboard" id="dashboard">
  <header>
    <div>
      <h1>Wedding Admin</h1>
      <div style="font-family: 'Courier Prime', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8a827a; margin-top: 4px;">JAEMIN &amp; JISOO · 2026.10.11</div>
    </div>
    <div class="actions">
      <button class="btn" id="refreshBtn">REFRESH</button>
      <button class="btn primary" id="csvBtn">CSV 다운로드</button>
      <button class="btn" id="logoutBtn">LOGOUT</button>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="label">TOTAL RSVP</div><div class="value" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">참석</div><div class="value" id="statYes">-</div></div>
    <div class="stat-card"><div class="label">불참</div><div class="value" id="statNo">-</div></div>
    <div class="stat-card"><div class="label">신랑측 / 신부측</div><div class="value" id="statSide">-</div></div>
    <div class="stat-card"><div class="label">예상 참석 인원</div><div class="value" id="statCount">-</div></div>
    <div class="stat-card"><div class="label">GUESTBOOK</div><div class="value" id="statGB">-</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="rsvp">RSVP · 참석 회신</button>
    <button class="tab" data-tab="guestbook">GUESTBOOK · 방명록</button>
  </div>

  <div class="tab-panel active" id="panelRsvp">
    <div class="loading" id="rsvpLoading">불러오는 중</div>
    <div class="table-wrap" id="rsvpTableWrap" style="display:none;">
      <table id="rsvpTable">
        <thead>
          <tr>
            <th>시각</th>
            <th>이름</th>
            <th>측</th>
            <th>참석</th>
            <th>인원</th>
            <th>메시지</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card-view" id="rsvpCards"></div>
  </div>

  <div class="tab-panel" id="panelGB">
    <div class="loading" id="gbLoading">불러오는 중</div>
    <div class="table-wrap" id="gbTableWrap" style="display:none;">
      <table id="gbTable">
        <thead>
          <tr>
            <th>시각</th>
            <th>이름</th>
            <th>메시지</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card-view" id="gbCards"></div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>

<script>
// ==================== 비밀번호 로그인 ====================
// ⚠️ 이 비밀번호는 클라이언트 사이드입니다. 하객이 페이지 소스를 보면 노출됩니다.
// 진짜 보안이 필요하면 Firebase Auth로 업그레이드하세요. 지금은 링크만 몰래 공유하는 정도의 방어입니다.
const ADMIN_PWD = '1011'; // 원하시는 비밀번호로 변경 가능

const loginWrap = document.getElementById('loginWrap');
const dashboard = document.getElementById('dashboard');

function tryLogin() {
  const pwd = document.getElementById('pwd').value;
  if (pwd === ADMIN_PWD) {
    sessionStorage.setItem('wedding-admin', '1');
    loginWrap.style.display = 'none';
    dashboard.classList.add('active');
    loadData();
  } else {
    alert('비밀번호가 올바르지 않습니다.');
    document.getElementById('pwd').value = '';
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pwd').addEventListener('keypress', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('wedding-admin');
  location.reload();
});

if (sessionStorage.getItem('wedding-admin') === '1') {
  loginWrap.style.display = 'none';
  dashboard.classList.add('active');
  window.addEventListener('weddingdb-ready', loadData);
  if (window.WeddingDB) loadData();
}

// ==================== 탭 ====================
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel' + (t.dataset.tab === 'rsvp' ? 'Rsvp' : 'GB')).classList.add('active');
  });
});

// ==================== 데이터 로드 ====================
let cachedRsvp = [];
let cachedGB = [];

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateTime(d) {
  if (!d) return '-';
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${m}.${day} ${hh}:${mm}`;
}

async function loadData() {
  if (!window.WeddingDB) return;

  // RSVP
  try {
    cachedRsvp = await window.WeddingDB.fetchAllRsvp();
    renderRsvp();
  } catch (err) {
    console.error(err);
    document.getElementById('rsvpLoading').textContent = '로드 실패: ' + err.message;
  }

  // 방명록
  try {
    cachedGB = await window.WeddingDB.fetchAllGuestbook();
    renderGB();
  } catch (err) {
    console.error(err);
    document.getElementById('gbLoading').textContent = '로드 실패: ' + err.message;
  }

  updateStats();
}

function updateStats() {
  const total = cachedRsvp.length;
  const yes = cachedRsvp.filter(r => r.attend === 'yes').length;
  const no = cachedRsvp.filter(r => r.attend === 'no').length;
  const groom = cachedRsvp.filter(r => r.side === 'groom').length;
  const bride = cachedRsvp.filter(r => r.side === 'bride').length;
  const totalCount = cachedRsvp
    .filter(r => r.attend === 'yes')
    .reduce((sum, r) => sum + (parseInt(r.count) || 1), 0);

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statYes').innerHTML = `${yes}<span class="sub">명</span>`;
  document.getElementById('statNo').innerHTML = `${no}<span class="sub">명</span>`;
  document.getElementById('statSide').innerHTML = `${groom}<span class="sub"> / </span>${bride}`;
  document.getElementById('statCount').innerHTML = `${totalCount}<span class="sub">명</span>`;
  document.getElementById('statGB').textContent = cachedGB.length;
}

function renderRsvp() {
  document.getElementById('rsvpLoading').style.display = 'none';

  if (cachedRsvp.length === 0) {
    document.getElementById('rsvpTableWrap').style.display = 'none';
    document.getElementById('rsvpCards').innerHTML = '<div class="empty">아직 회신이 없습니다</div>';
    return;
  }

  document.getElementById('rsvpTableWrap').style.display = '';

  const tbody = document.querySelector('#rsvpTable tbody');
  tbody.innerHTML = cachedRsvp.map(r => `
    <tr>
      <td class="date-cell">${fmtDateTime(r.createdAt)}</td>
      <td><strong>${escapeHtml(r.name)}</strong></td>
      <td><span class="badge badge-${r.side}">${r.side === 'groom' ? '신랑측' : '신부측'}</span></td>
      <td><span class="badge badge-${r.attend}">${r.attend === 'yes' ? '참석' : '불참'}</span></td>
      <td>${escapeHtml(r.count || '1')}명</td>
      <td class="msg-cell">${escapeHtml(r.message || '')}</td>
    </tr>
  `).join('');

  // 모바일 카드
  const cards = document.getElementById('rsvpCards');
  cards.innerHTML = cachedRsvp.map(r => `
    <div class="msg-card">
      <div class="row">
        <span class="name">${escapeHtml(r.name)}</span>
        <span class="meta">${fmtDateTime(r.createdAt)}</span>
      </div>
      <div class="row">
        <span class="badge badge-${r.side}">${r.side === 'groom' ? '신랑측' : '신부측'}</span>
        <span class="badge badge-${r.attend}">${r.attend === 'yes' ? '참석' : '불참'}</span>
        <span class="meta">${escapeHtml(r.count || '1')}명</span>
      </div>
      ${r.message ? `<div class="body">${escapeHtml(r.message)}</div>` : ''}
    </div>
  `).join('');
}

function renderGB() {
  document.getElementById('gbLoading').style.display = 'none';

  if (cachedGB.length === 0) {
    document.getElementById('gbTableWrap').style.display = 'none';
    document.getElementById('gbCards').innerHTML = '<div class="empty">아직 방명록 메시지가 없습니다</div>';
    return;
  }

  document.getElementById('gbTableWrap').style.display = '';
  const tbody = document.querySelector('#gbTable tbody');
  tbody.innerHTML = cachedGB.map(g => `
    <tr>
      <td class="date-cell">${fmtDateTime(g.createdAt)}</td>
      <td><strong>${escapeHtml(g.name)}</strong></td>
      <td class="msg-cell">${escapeHtml(g.msg)}</td>
    </tr>
  `).join('');

  const cards = document.getElementById('gbCards');
  cards.innerHTML = cachedGB.map(g => `
    <div class="msg-card">
      <div class="row">
        <span class="name">${escapeHtml(g.name)}</span>
        <span class="meta">${fmtDateTime(g.createdAt)}</span>
      </div>
      <div class="body">${escapeHtml(g.msg)}</div>
    </div>
  `).join('');
}

document.getElementById('refreshBtn').addEventListener('click', loadData);

// ==================== CSV 다운로드 ====================
function toCsv(rows, headers) {
  const escape = v => {
    if (v == null) return '';
    const s = String(v).replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  };
  const head = headers.map(h => escape(h.label)).join(',');
  const body = rows.map(r =>
    headers.map(h => escape(typeof h.get === 'function' ? h.get(r) : r[h.key])).join(',')
  ).join('\n');
  return '\uFEFF' + head + '\n' + body; // BOM for excel Korean support
}
function downloadCsv(filename, content) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 300);
}
document.getElementById('csvBtn').addEventListener('click', () => {
  const date = new Date().toISOString().slice(0, 10);

  const rsvpCsv = toCsv(cachedRsvp, [
    { label: '시각', get: r => fmtDateTime(r.createdAt) },
    { label: '이름', key: 'name' },
    { label: '측', get: r => r.side === 'groom' ? '신랑측' : (r.side === 'bride' ? '신부측' : '') },
    { label: '참석여부', get: r => r.attend === 'yes' ? '참석' : (r.attend === 'no' ? '불참' : '') },
    { label: '인원', key: 'count' },
    { label: '메시지', key: 'message' }
  ]);
  downloadCsv(`RSVP_${date}.csv`, rsvpCsv);

  const gbCsv = toCsv(cachedGB, [
    { label: '시각', get: r => fmtDateTime(r.createdAt) },
    { label: '이름', key: 'name' },
    { label: '메시지', key: 'msg' }
  ]);
  setTimeout(() => downloadCsv(`GUESTBOOK_${date}.csv`, gbCsv), 200);
});
</script>

</body>
</html>
